worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Selfie/KYC document uploads go through this proxy — default 1m is too small.
  client_max_body_size 15m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Basic security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Light rate limiting at the edge, in front of the backend's own
  # per-endpoint limiters (defense in depth, not a replacement for them).
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  upstream backend_upstream {
    server backend:5000;
  }

  upstream frontend_upstream {
    server frontend:3000;
  }

  # ─── HTTP: redirect to HTTPS ────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Uncomment once certbot has issued a real certificate (see
    # SETUP.md / DEPLOYMENT.md for the certbot walkthrough) — until then,
    # serve over plain HTTP so the box is reachable at all.
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # return 301 https://$host$request_uri;

    location /api/ {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://backend_upstream/health;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ─── HTTPS ───────────────────────────────────────────────────
  # Disabled until real certs exist at ./nginx/ssl/ (see DEPLOYMENT.md
  # §5-6). Uncomment this whole block once fullchain.pem/privkey.pem are
  # in place — self-signed for local HTTPS testing, or certbot-issued
  # for a real domain.
  #
  # server {
  #   listen 443 ssl;
  #   server_name your-domain.com;
  #
  #   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_ciphers HIGH:!aNULL:!MD5;
  #
  #   location /api/ {
  #     limit_req zone=general burst=40 nodelay;
  #     proxy_pass http://backend_upstream;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  #
  #   location /socket.io/ {
  #     proxy_pass http://backend_upstream;
  #     proxy_http_version 1.1;
  #     proxy_set_header Upgrade $http_upgrade;
  #     proxy_set_header Connection "upgrade";
  #     proxy_set_header Host $host;
  #   }
  #
  #   location / {
  #     proxy_pass http://frontend_upstream;
  #     proxy_http_version 1.1;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # }
}
